<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>

    <!-- START SCREEN -->
    <div class="screen" id="start-screen">
        <div class="card start-card">
            <div class="quiz-icon">&#129504;</div>
            <h1 class="quiz-title">Quiz App</h1>
            <p class="quiz-subtitle">Test your knowledge with 10 questions</p>
            <div class="info-row">
                <div class="info-item">
                    <span class="info-icon">&#128337;</span>
                    <span>10 Questions</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">&#9889;</span>
                    <span>15 sec / Q</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">&#127942;</span>
                    <span>10 Points</span>
                </div>
            </div>
            <button class="btn btn-primary" id="start-btn" onclick="render_questions()">Start Quiz</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen hidden" id="quiz-screen">
        <div class="quiz-container">

            <!-- Top Bar -->
            <div class="quiz-topbar">
                <div class="progress-info">
                    <span class="question-counter">Question <span id="current-q">1</span> of <span id="total-q">10</span></span>
                </div>
                <div class="score-badge">
                    Score: <span id="score">0</span>
                </div>
                <div class="timer-wrap">
                    <div class="timer-circle">
                        <span id="timer">15</span>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progress-bar" style="width: 10%"></div>
            </div>

            <!-- Question Card -->
            <div class="card question-card" id="question-card">
                

                <!-- Options -->

                
            </div>

        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div class="screen hidden" id="result-screen">
        <div class="card result-card">

            <div class="result-icon" id="result-icon">&#127942;</div>
            <h2 class="result-title" id="result-title">Excellent!</h2>
            <p class="result-subtitle" id="result-subtitle">You really know your stuff!</p>

            <div class="score-display">
                <div class="score-circle">
                    <span class="score-number" id="final-score">8</span>
                    <span class="score-total">/ 10</span>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box correct-stat">
                    <span class="stat-num" id="correct-count">8</span>
                    <span class="stat-label">Correct</span>
                </div>
                <div class="stat-box wrong-stat">
                    <span class="stat-num" id="wrong-count">2</span>
                    <span class="stat-label">Wrong</span>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn btn-primary" id="retry-btn" onclick="playAgain()">&#128257; Play Again</button>
                <button class="btn btn-outline" id="review-btn" onclick="showReview()">&#128203; Review Answers</button>
            </div>

        </div>
    </div>

    <!-- REVIEW SCREEN -->
    <div class="screen hidden" id="review-screen">
        <div class="quiz-container">
            <div class="card review-card">
                <div class="review-topbar">
                    <h2 class="review-title">&#128203; Answer Review</h2>
                    <button class="btn btn-primary btn-sm" onclick="playAgain()">&#128257; Play Again</button>
                </div>
                <div id="review-list" class="review-list"></div>
            </div>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>
</html> -->
